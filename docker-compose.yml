# One-command demo:   docker compose up --build
# then open http://localhost:8080 — the app opens pre-filled for the mock target.
#
#   frontend  nginx serving the built React app on :8080; proxies /api to the backend
#   backend   the Spring Boot API (Java 21), H2 database in a volume
#   mock      the Java mock login API, reachable from the backend as http://mock:8000/api/login
#
# Inside compose the mock has a private address (172.x), so the backend runs with
# ALLOW_PRIVATE_TARGETS=true. Never do that on a public deployment.
# The CLI on the host can use http://localhost:8080 (nginx forwards /api to the backend).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: elevate/load-tester:latest
    environment:
      ALLOW_PRIVATE_TARGETS: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      MAX_ACTIVE_RUNS: "1"
    volumes:
      - backend-data:/data
    healthcheck:
      # The JRE image has no curl; bash can open a TCP connection itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q ok <&3"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      - mock

  mock:
    build:
      context: .
      dockerfile: mock-target/Dockerfile
    image: elevate/mock-target:latest
    ports:
      - "8000:8000"   # optional: reach the mock from the host too

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8080
        VITE_DEFAULT_TARGET: http://mock:8000/api/login
        VITE_DEFAULT_SAMPLE: '{"username": "demo", "password": "demo123", "expiresInMins": 30}'
    image: elevate/load-tester-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
