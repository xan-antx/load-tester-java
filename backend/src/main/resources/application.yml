# Elevate Load Tester (Java Edition) — backend settings.
# Every elevate.* value can be set with the environment variable named in ${...}.
server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: load-tester
  datasource:
    # H2 file database in ./data (git-ignored). Docker sets DATA_DIR=/data.
    # H2_AUTO_SERVER=TRUE lets a queue-mode worker open the same database file.
    url: jdbc:h2:file:${DATA_DIR:./data}/loadtester;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=${H2_AUTO_SERVER:FALSE}
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    # JSON field names as in the Python version: job_id, is_group, ...
    property-naming-strategy: SNAKE_CASE

elevate:
  # Private, loopback, link-local and multicast targets (cloud metadata is always blocked).
  allow-private-targets: ${ALLOW_PRIVATE_TARGETS:true}
  # Load tests that may be queued or running at the same time (a split run or series counts once).
  max-active-runs: ${MAX_ACTIVE_RUNS:1}
  # Browser origins allowed to call the API (comma-separated).
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # Mark runs left queued/running by a previous process as interrupted at startup.
  recover-stale-runs: ${RECOVER_STALE_RUNS:true}
  # Queue mode (NOT DEPLOYED — future work, as in the Python version): jobs go to an SQS
  # queue and a separate worker (java -jar load-tester.jar worker) runs them.
  queue:
    use-sqs: ${USE_SQS:false}
    sqs-queue-url: ${SQS_QUEUE_URL:}
    aws-region: ${AWS_DEFAULT_REGION:eu-north-1}
  engine:
    think-time-min: 500ms
    think-time-max: 2s
    request-timeout: 30s
