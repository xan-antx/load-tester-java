name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Maven build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, unit tests, integration tests, coverage gate
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  performance-gate:
    name: Performance gate (CLI against the mock)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the jars
        run: ./mvnw -B -q package -DskipTests
      - name: Start the mock target and the backend
        run: |
          java -jar mock-target/target/mock-target-1.0.0-exec.jar > mock.log 2>&1 &
          DATA_DIR="$RUNNER_TEMP/data" java -jar backend/target/load-tester.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/health && curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "services did not start"; cat backend.log mock.log; exit 1
      - name: Run the CLI with loadtest.ci.yml
        id: gate
        run: |
          set +e
          java -jar backend/target/load-tester.jar run --config loadtest.ci.yml
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Performance gate (exit code $code)"
            echo
            cat perf-results/summary.md 2>/dev/null || echo "No summary was written."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            perf-results/
            backend.log
      - name: Fail on a non-zero exit code
        if: steps.gate.outputs.exit_code != '0'
        run: |
          echo "The performance gate failed with exit code ${{ steps.gate.outputs.exit_code }} (1 = SLO failed, 2 = error)."
          exit 1

  images:
    name: Build and push images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend, performance-gate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name prefix (GHCR needs lowercase)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/elevate" >> "$GITHUB_ENV"
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.PREFIX }}-backend:latest,${{ env.PREFIX }}-backend:${{ github.sha }}
      - name: Mock target image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mock-target/Dockerfile
          push: true
          tags: ${{ env.PREFIX }}-mock:latest,${{ env.PREFIX }}-mock:${{ github.sha }}
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_BASE=http://localhost:8080
          tags: ${{ env.PREFIX }}-frontend:latest,${{ env.PREFIX }}-frontend:${{ github.sha }}
